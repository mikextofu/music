<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101010">
<title>Music Projects</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&family=Special+Elite&family=UnifrakturCook:wght@700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#101010;--fg:#e9e7e1;--muted:#77756f;--line:#353430;--accent:#d7d2c7}
*{box-sizing:border-box}
html{min-height:100%;background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--fg);background:radial-gradient(ellipse at 50% 0%,rgba(110,105,94,.12),transparent 42%),repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0,rgba(255,255,255,.018) 1px,transparent 1px,transparent 4px),var(--bg)}
main{max-width:1040px;margin:auto;padding:clamp(70px,13vh,150px) clamp(20px,5vw,54px) 70px}
.projects{border-top:1px solid var(--line)}
.project{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:center;padding:38px 0;border-bottom:1px solid var(--line);min-height:142px}
.name{margin:0;font-size:clamp(38px,7vw,76px);line-height:.95;font-weight:700;text-transform:uppercase;transition:opacity .2s}
.project:hover .name{opacity:.78}
.mike .name{font-family:'Space Grotesk',Arial,sans-serif;font-weight:700;letter-spacing:-.075em}
.catechesis .name{font-family:'UnifrakturCook',Georgia,serif;font-weight:700;letter-spacing:.005em;text-transform:none;font-size:clamp(43px,7.2vw,82px)}
.martyras .name{font-family:'Barlow Condensed',Impact,sans-serif;font-weight:900;letter-spacing:.015em;font-size:clamp(48px,8vw,88px)}
.ricextofu .name{font-family:'Special Elite','Courier New',monospace;font-weight:400;letter-spacing:-.055em;text-transform:uppercase;font-size:clamp(35px,6.5vw,68px)}
.links{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:8px}
.links a{display:inline-block;border:1px solid #45433e;color:var(--accent);padding:11px 13px;text-decoration:none;font:10px/1 'DM Mono',monospace;letter-spacing:.12em;text-transform:uppercase;transition:background .18s,color .18s,border-color .18s}
.links a:hover,.links a:focus-visible{background:var(--accent);color:#101010;border-color:var(--accent);outline:none}
@media(max-width:650px){main{padding-top:54px}.project{grid-template-columns:1fr;gap:20px;padding:28px 0;min-height:0}.links{justify-content:flex-start}.links a{padding:10px 11px}.catechesis .name{font-size:clamp(42px,12vw,66px)}}
</style>
</head>
<body>
<main>
<section class="projects" aria-label="Music projects">
<article class="project mike"><h2 class="name">Mike Tofu</h2><nav class="links" aria-label="Mike Tofu links"><a href="https://open.spotify.com/artist/0FlUh94EWNSxTGdpdQ057S?si=JAzcqkYcQiS4YoVsiYYbAA&utm_source=copy-link" target="_blank" rel="noopener noreferrer">Spotify ↗</a><a href="https://youtube.com/channel/UCE_8tT0dkhx72-Luvd3TNdA?si=377HacpJ6n0g2_Oh" target="_blank" rel="noopener noreferrer">YouTube ↗</a></nav></article>
<article class="project catechesis"><h2 class="name">Catechesis</h2><nav class="links" aria-label="Catechesis links"><a href="https://catechesis.bandcamp.com/track/psalm-22" target="_blank" rel="noopener noreferrer">Bandcamp ↗</a><a href="https://open.spotify.com/artist/1ANnctEE6UV289SPTh3f0T?si=7lK1h-UzQaq9qQQWAa6oZA&utm_source=copy-link" target="_blank" rel="noopener noreferrer">Spotify ↗</a><a href="https://youtube.com/playlist?list=OLAK5uy_llLSLVfMUQSQFqbzEZFF-7WW3r_J-I2Pc&si=FY2-p_0WB7Q5W08K" target="_blank" rel="noopener noreferrer">YouTube ↗</a></nav></article>
<article class="project martyras"><h2 class="name">Martyras</h2><nav class="links" aria-label="Martyras links"><a href="https://martyras.bandcamp.com/track/the-cry-for-a-fallen-soldiers" target="_blank" rel="noopener noreferrer">Bandcamp ↗</a></nav></article>
<article class="project ricextofu"><h2 class="name">Ricextofu</h2><nav class="links" aria-label="Ricextofu links"><a href="https://ricextofu.bandcamp.com/album/life-death-ep-2021" target="_blank" rel="noopener noreferrer">Bandcamp ↗</a><a href="https://open.spotify.com/artist/3peTkcNMVC5AcPIzoy1Axt?si=bbuCPYwETomsZ7gktbBLWQ&utm_source=copy-link" target="_blank" rel="noopener noreferrer">Spotify ↗</a><a href="https://youtu.be/kf4Y2_PYvkA?is=8wZ7SYa6i5718l4P" target="_blank" rel="noopener noreferrer">YouTube ↗</a></nav></article>
</section>
</main>
</body>
</html>
